version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: tracker-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: task_tracker
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracker-app
    restart: always
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: 'mysql://root:password@db:3306/task_tracker'
      NODE_ENV: 'production'
      PORT: '5000'
      JWT_SECRET: 'production-jwt-secret-key-change-this'
      JWT_REFRESH_SECRET: 'production-jwt-refresh-secret-change-this'
      CORS_ORIGIN: 'http://localhost:5000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
